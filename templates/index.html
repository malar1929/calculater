<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e0eafc, #cfdef3);
      }

      .calculator {
        width: 320px;
        background: #1f2937;
        border-radius: 18px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        padding: 18px;
      }

      .display {
        width: 100%;
        height: 70px;
        margin-bottom: 16px;
        border: none;
        border-radius: 12px;
        background: #111827;
        color: #fff;
        font-size: 2rem;
        text-align: right;
        padding: 0 16px;
        outline: none;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      button {
        border: none;
        border-radius: 12px;
        height: 58px;
        font-size: 1.2rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.1s ease, opacity 0.2s ease;
      }

      button:hover {
        opacity: 0.95;
      }

      button:active {
        transform: scale(0.98);
      }

      .operator {
        background: #f59e0b;
        color: white;
      }

      .number {
        background: #e5e7eb;
        color: #111827;
      }

      .special {
        background: #9ca3af;
        color: #111827;
      }

      .equal {
        background: #10b981;
        color: white;
        grid-column: span 2;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <input id="display" class="display" type="text" value="0" readonly />

      <div class="buttons">
        <button class="special" data-action="clear">C</button>
        <button class="special" data-action="delete">DEL</button>
        <button class="operator" data-value="/">÷</button>
        <button class="operator" data-value="*">×</button>

        <button class="number" data-value="7">7</button>
        <button class="number" data-value="8">8</button>
        <button class="number" data-value="9">9</button>
        <button class="operator" data-value="-">−</button>

        <button class="number" data-value="4">4</button>
        <button class="number" data-value="5">5</button>
        <button class="number" data-value="6">6</button>
        <button class="operator" data-value="+">+</button>

        <button class="number" data-value="1">1</button>
        <button class="number" data-value="2">2</button>
        <button class="number" data-value="3">3</button>
        <button class="equal" data-action="equals">=</button>

        <button class="number" data-value="0" style="grid-column: span 2;">0</button>
        <button class="number" data-value=".">.</button>
      </div>
    </div>

    <script>
      const display = document.getElementById('display');
      let expression = '';

      function updateDisplay(value) {
        display.value = value;
      }

      function appendValue(value) {
        if (value === '.' && expression.includes('.') && /[0-9]$/.test(expression.split(/[-+*/]/).at(-1))) {
          return;
        }

        if (['+', '-', '*', '/'].includes(value)) {
          const lastChar = expression.slice(-1);
          if (!expression || ['+', '-', '*', '/'].includes(lastChar)) {
            if (value === '-' && (!expression || ['+', '*', '/'].includes(lastChar))) {
              expression += value;
            } else if (!expression || lastChar !== '-' || value !== '-') {
              if (expression && ['+', '-', '*', '/'].includes(lastChar)) {
                expression = expression.slice(0, -1) + value;
              } else {
                expression += value;
              }
            }
          } else {
            expression += value;
          }
        } else {
          expression += value;
        }

        updateDisplay(expression || '0');
      }

      function clearDisplay() {
        expression = '';
        updateDisplay('0');
      }

      function deleteLast() {
        expression = expression.slice(0, -1);
        updateDisplay(expression || '0');
      }

      function calculate() {
        try {
          const result = Function('"use strict"; return (' + expression + ');')();
          if (!Number.isFinite(result)) {
            throw new Error('Invalid calculation');
          }
          expression = String(result);
          updateDisplay(expression);
        } catch (error) {
          expression = '';
          updateDisplay('Error');
        }
      }

      document.querySelectorAll('.number').forEach((button) => {
        button.addEventListener('click', () => appendValue(button.dataset.value));
      });

      document.querySelectorAll('.operator').forEach((button) => {
        button.addEventListener('click', () => appendValue(button.dataset.value));
      });

      document.querySelector('[data-action="clear"]').addEventListener('click', clearDisplay);
      document.querySelector('[data-action="delete"]').addEventListener('click', deleteLast);
      document.querySelector('[data-action="equals"]').addEventListener('click', calculate);
    </script>
  </body>
</html>
